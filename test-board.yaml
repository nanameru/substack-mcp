version: 1
project:
  name: "substack-mcp"
  test_command: "npm run type-check"
  repo: "nanameru/substack-mcp"

source_roots:
  - worker
  - src

cases:
  - id: TC-007
    title: "OAuth接続: フォーム送信後に登録済みChatGPTの戻り先へ遷移できる"
    feature: "Cloudflare Remote MCP OAuth"
    scenario: "検証済みredirectUriのoriginをCSPへ許可し、パスやクエリのCSP注入を防ぐ"
    status: done
    priority: high
    type: regression
    source: [worker/oauth.ts]
    test_file: "worker/oauth.test.ts"
    issues: [10]
    notes: "変更前の許可不足を回帰テストで確認し、14件のNodeテスト・型検査・dry-run成功。2026-09-16に本番6da579c2へ反映後、ChromeでChatGPTの接続完了表示と12個のActionsを確認。token交換200、認証済みMCP200。下書き・履歴の実取得はこの検証では未実施。"
  - id: TC-006
    title: "Cookie接続診断: 認証に使わないCookieのGETとPOST到達を比較する"
    feature: "Cloudflare Remote MCP OAuth"
    scenario: "通常名と__Host-名の短命Cookieを比較し、秘密情報や認証権限なしで結果を返す"
    status: done
    priority: high
    type: regression
    source: [worker/oauth.ts, worker/cookie-diagnostics.ts]
    test_file: "worker/cookie-diagnostics.test.ts"
    issues: [10]
    notes: "診断の3件の回帰テストと既存9件、型検査、Containerを保持するdry-runが成功。ローカルおよび本番ChromeでGET/POSTとも通常名・__Host-名の到達を確認。Cookie値やOAuth情報を返さず、KV/D1/Substackへアクセスしない。"
  - id: TC-005
    title: "Remote MCP OAuth: CSRF失敗の原因を秘密情報なしで区別する"
    feature: "Cloudflare Remote MCP OAuth"
    scenario: "Cookie未送信・値不一致・フォーム欠落を拒否し、認証応答のキャッシュを禁止する"
    status: done
    priority: high
    type: regression
    source: [worker/oauth.ts]
    test_file: "worker/oauth.test.ts"
    issues: [10]
    notes: "JSON/HTMLの両形式で固定コードを返し、フォーム・Cookie値の非開示とKV書き込みなしを検証。実ブラウザの接続成功は未確認。"
  - id: TC-001
    title: "Cloudflare Remote MCP本番デプロイ: OAuth保護されたMCPへ接続し読み取り専用で下書きを1件取得する"
    feature: "Cloudflare Remote MCP本番デプロイ"
    scenario: "OAuth保護されたMCPへ接続し読み取り専用で下書きを1件取得する"
    status: passed
    priority: high
    type: e2e
    source: [worker/index.ts, worker/oauth.ts, src/substack_mcp/cloud_api.py, wrangler.jsonc]
    test_file: ""
    issues: [6, 8]
    notes: "2026-09-12にChatGPTからOAuth接続し、11ツールの認識とlist_drafts(limit=1)の成功を確認。Issue #8の再デプロイ後にもGPT Workから再確認。記事本文は表示せず、書き込み系ツールは未実行。"
  - id: TC-002
    title: "Substack Notes投稿: 上流HTTP失敗を秘密情報なしで診断し正しいpayloadを送る"
    feature: "Substack Notes投稿"
    scenario: "上流HTTP失敗を秘密情報なしで診断し正しいpayloadを送る"
    status: done
    priority: medium
    type: regression
    source: [worker/index.ts, src/substack_mcp/client.py, src/substack_mcp/cloud_api.py]
    test_file: "tests/test_note_posting.py"
    issues: [8]
    notes: "2026-09-12の1回限定ライブテストでHTTP応答外のRuntimeErrorが残存。送信・応答解析phaseの安全な診断を追加。追加診断版ではChatGPT側のtext欠落を確認したため、text/contentを受けてtextへ正規化する互換スキーマを追加。修正版の承認済み1回限定テストでNote 335417972の公開と本文反映を公開feedから確認し、重複なし。7件の実送信なし回帰テスト、Python構文、TypeScript型検査、Container dry-runにも成功。"
  - id: TC-003
    title: "Substack Notes履歴: D1へ投稿を予約し同一本文の二重投稿を防ぐ"
    feature: "Substack Notes投稿履歴"
    scenario: "正規化本文を一意に予約し成功・結果不明を保存する"
    status: done
    priority: high
    type: regression
    source: [worker/index.ts, worker/note-history.ts, migrations/0001_create_note_publications.sql, wrangler.jsonc]
    test_file: "worker/note-history.test.ts"
    issues: [10]
    notes: "正規化とSHA-256、同一本文の拒否、published/unknown状態、履歴の新しい順取得を4件のNodeテストで実送信なしに検証。ローカルD1 migration、TypeScript型検査、既存Python 7件、Container dry-runも成功。"
  - id: TC-004
    title: "Remote MCP OAuth: 並行して開始された認証フローのCSRF Cookieを分離する"
    feature: "Cloudflare Remote MCP OAuth"
    scenario: "同じブラウザで複数の認証画面が生成されても各フォームをGitHub認証へ進められる"
    status: passed
    priority: high
    type: regression
    source: [worker/oauth.ts]
    test_file: "worker/oauth.test.ts"
    issues: [10]
    notes: "固定名のCSRF Cookieが後続の認証GETで上書きされる回帰を再現。認証フロー固有のCookie名へ変更後、並行2フローがともにGitHub認証へ遷移することをNodeテストで確認。"
