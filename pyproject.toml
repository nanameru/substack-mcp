[project]
name = "substack-mcp"
version = "0.1.0"
description = "MCP server for Substack — create, update, schedule, publish posts with images and cover thumbnails"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taiyo Kimura" }]
dependencies = [
    "mcp>=1.30.0,<2",
    "python-substack~=0.1.20",
    "pydantic~=2.0",
    "platformdirs~=4.0",
    "playwright~=1.40",
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "PyJWT>=2.15.0",
    "urllib3>=2.8.0",
    "anyio>=4.14.2",
    "idna>=3.15",
    "starlette>=1.3.1",
]

[project.scripts]
substack-mcp = "substack_mcp.server:main"
substack-mcp-setup = "substack_mcp.setup_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substack_mcp"]
